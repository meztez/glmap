<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 924" width="100%" height="100%">
  <defs>
    <!-- Deep nocturnal slate background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="55%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Crisp Viridis-to-Indigo hex border gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 4 Low-Poly GPU Terrain Mesh Facets -->
    <linearGradient id="facetBackLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <linearGradient id="facetBackRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="facetFrontLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="facetFrontRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Soft ambient radial glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="37%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="hexClip">
      <polygon points="400,26 760,234 760,690 400,898 40,690 40,234"/>
    </clipPath>
  </defs>

  <!-- Outer Hex Border & Deep Slate Canvas -->
  <polygon points="400,12 774,227 774,697 400,912 26,697 26,227" fill="url(#rimGrad)"/>
  <polygon points="400,26 760,234 760,690 400,898 40,690 40,234" fill="url(#bgGrad)"/>

  <g clip-path="url(#hexClip)">
    <!-- Subtle Ambient Shader Glow -->
    <circle cx="400" cy="345" r="350" fill="url(#ambientGlow)"/>

    <!-- Stacked Isometric Map Planes (Clean Vector Layers Below Peak) -->
    <polyline points="175,415 400,535 625,415" fill="none" stroke="#38bdf8" stroke-width="6.5" stroke-opacity="0.60" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="205,460 400,565 595,460" fill="none" stroke="#818cf8" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Minimal 4-Facet Isometric GPU Terrain Peak (C++ Earcut Mesh + Map Tile) -->
    <g stroke="#f8fafc" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="400,140 185,365 400,315" fill="url(#facetBackLeft)"/>
      <polygon points="400,140 615,365 400,315" fill="url(#facetBackRight)"/>
      <polygon points="185,365 400,485 400,315" fill="url(#facetFrontLeft)"/>
      <polygon points="615,365 400,485 400,315" fill="url(#facetFrontRight)"/>
    </g>

    <!-- 5 Crisp Instanced SDF Vertex Nodes -->
    <circle cx="400" cy="140" r="13" fill="#060a12" stroke="#5eead4" stroke-width="6.5"/>
    <circle cx="185" cy="365" r="9.5" fill="#ffffff"/>
    <circle cx="615" cy="365" r="9.5" fill="#ffffff"/>
    <circle cx="400" cy="315" r="10.5" fill="#060a12" stroke="#ffffff" stroke-width="6"/>
    <circle cx="400" cy="485" r="9.5" fill="#ffffff"/>

    <!-- Clean Modern Wordmark -->
    <text x="400" y="705" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="120" font-weight="800" fill="#f8fafc" letter-spacing="2">
      gl<tspan fill="#2dd4bf">map</tspan>
    </text>
  </g>

  <!-- Subtle Inner Hex Frame Line -->
  <polygon points="400,36 750,239 750,685 400,888 50,685 50,239" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.28"/>
</svg>
