<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 924" width="100%" height="100%">
  <defs>
    <!-- Deep space slate background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Outer metallic neon border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Terrain DEM glow gradient -->
    <radialGradient id="demGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.20"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Hex prism gradients -->
    <linearGradient id="hexCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hexPlasma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="hexGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Soft neon glow filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="hexClip">
      <polygon points="400,24 762,233 762,691 400,900 38,691 38,233"/>
    </clipPath>
  </defs>

  <!-- Main Hexagon Base -->
  <polygon points="400,12 774,227 774,697 400,912 26,697 26,227" fill="url(#borderGrad)"/>
  <polygon points="400,28 758,235 758,689 400,896 42,689 42,235" fill="url(#bgGrad)"/>

  <g clip-path="url(#hexClip)">
    <!-- Ambient GPU Shader Glow -->
    <circle cx="400" cy="410" r="360" fill="url(#demGlow)"/>

    <!-- Perspective WebGL Wireframe Terrain Grid (Bottom Layer) -->
    <g stroke="#1e293b" stroke-width="1.5" opacity="0.75">
      <line x1="40" y1="540" x2="760" y2="540"/>
      <line x1="40" y1="585" x2="760" y2="585"/>
      <line x1="40" y1="635" x2="760" y2="635"/>
      <line x1="40" y1="690" x2="760" y2="690"/>
      <line x1="40" y1="750" x2="760" y2="750"/>
      <line x1="40" y1="815" x2="760" y2="815"/>
      <line x1="400" y1="360" x2="-120" y2="880"/>
      <line x1="400" y1="360" x2="60" y2="880"/>
      <line x1="400" y1="360" x2="230" y2="880"/>
      <line x1="400" y1="360" x2="400" y2="880"/>
      <line x1="400" y1="360" x2="570" y2="880"/>
      <line x1="400" y1="360" x2="740" y2="880"/>
      <line x1="400" y1="360" x2="920" y2="880"/>
    </g>

    <!-- GPU Elevation Contour Curves (Middle Layer) -->
    <path d="M 55 470 Q 220 350, 400 430 T 745 410" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.45"/>
    <path d="M 55 505 Q 240 385, 410 465 T 745 450" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.65"/>
    <path d="M 55 540 Q 260 420, 420 500 T 745 490" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.55"/>

    <!-- C++ Earcut Triangulation Mesh Network (Upper Background) -->
    <g stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.38" fill="none">
      <polygon points="170,250 265,190 240,295"/>
      <polygon points="265,190 360,220 240,295"/>
      <polygon points="265,190 395,145 360,220"/>
      <polygon points="395,145 510,180 360,220"/>
      <polygon points="510,180 480,275 360,220"/>
      <polygon points="510,180 615,235 480,275"/>
      <polygon points="615,235 570,320 480,275"/>
    </g>

    <!-- 3D Extruded Hexagonal GPU Columns (Centerpiece) -->
    <!-- Left Hex Column (Plasma Purple) -->
    <g transform="translate(230, 345)">
      <polygon points="0,-38 52,-16 52,72 0,94 -52,72 -52,-16" fill="url(#hexPlasma)" opacity="0.92"/>
      <polygon points="0,-38 52,-16 0,6 -52,-16" fill="#f472b6"/>
      <polygon points="-52,-16 0,6 0,94 -52,72" fill="#9333ea" opacity="0.85"/>
      <polygon points="0,6 52,-16 52,72 0,94" fill="#581c87" opacity="0.90"/>
      <polygon points="0,-38 52,-16 0,6 -52,-16" fill="none" stroke="#fbcfe8" stroke-width="1.5"/>
    </g>

    <!-- Right Hex Column (Cyan GPU Shader) -->
    <g transform="translate(565, 335)">
      <polygon points="0,-42 54,-18 54,84 0,108 -54,84 -54,-18" fill="url(#hexCyan)" opacity="0.92"/>
      <polygon points="0,-42 54,-18 0,6 -54,-18" fill="#a5f3fc"/>
      <polygon points="-54,-18 0,6 0,108 -54,84" fill="#06b6d4" opacity="0.85"/>
      <polygon points="0,6 54,-18 54,84 0,108" fill="#0369a1" opacity="0.92"/>
      <polygon points="0,-42 54,-18 0,6 -54,-18" fill="none" stroke="#ecfeff" stroke-width="1.5"/>
    </g>

    <!-- Back-Center Hex Column (Emerald/Teal) -->
    <g transform="translate(330, 275)">
      <polygon points="0,-36 48,-15 48,95 0,116 -48,95 -48,-15" fill="#0d9488" opacity="0.88"/>
      <polygon points="0,-36 48,-15 0,6 -48,-15" fill="#5eead4"/>
      <polygon points="-48,-15 0,6 0,116 -48,95" fill="#14b8a6" opacity="0.85"/>
      <polygon points="0,6 48,-15 48,95 0,116" fill="#115e59" opacity="0.92"/>
    </g>

    <!-- Hero Center Hex Column (Gold/Orange Turbo Peak) -->
    <g transform="translate(415, 250)" filter="url(#glow)">
      <polygon points="0,-52 68,-22 68,145 0,175 -68,145 -68,-22" fill="url(#hexGold)"/>
      <polygon points="0,-52 68,-22 0,8 -68,-22" fill="#fef08a"/>
      <polygon points="-68,-22 0,8 0,175 -68,145" fill="#f97316" opacity="0.90"/>
      <polygon points="0,8 68,-22 68,145 0,175" fill="#c2410c" opacity="0.95"/>
      <polygon points="0,-52 68,-22 0,8 -68,-22" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Front-Right Mid Hex Column -->
    <g transform="translate(495, 395)">
      <polygon points="0,-32 46,-14 46,56 0,74 -46,56 -46,-14" fill="#3b82f6" opacity="0.92"/>
      <polygon points="0,-32 46,-14 0,4 -46,-14" fill="#93c5fd"/>
      <polygon points="-46,-14 0,4 0,74 -46,56" fill="#2563eb"/>
      <polygon points="0,4 46,-14 46,56 0,74" fill="#1d4ed8"/>
    </g>

    <!-- Glowing Instanced SDF Point Cloud Constellation -->
    <g filter="url(#glow)">
      <circle cx="170" cy="250" r="6.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="265" cy="190" r="8" fill="#22d3ee" stroke="#ffffff" stroke-width="2"/>
      <circle cx="395" cy="145" r="9.5" fill="#fde047" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="510" cy="180" r="8" fill="#f472b6" stroke="#ffffff" stroke-width="2"/>
      <circle cx="615" cy="235" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
      <circle cx="145" cy="390" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="655" cy="385" r="5.5" fill="#4ade80" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="310" cy="445" r="6.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Dark Gradient Vignette Behind Title -->
    <rect x="0" y="545" width="800" height="380" fill="#060913" opacity="0.82"/>
    <line x1="140" y1="560" x2="660" y2="560" stroke="url(#borderGrad)" stroke-width="3" opacity="0.85"/>

    <!-- Package Title Typography -->
    <text x="400" y="665" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="122" font-weight="800" fill="#f8fafc" letter-spacing="3">
      gl<tspan fill="#38bdf8">map</tspan>
    </text>

    <!-- Subtitle Pill -->
    <text x="400" y="725" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="600" fill="#94a3b8" letter-spacing="4">
      C++17 • WEBGL2 • MAPLIBRE
    </text>

    <!-- Bottom Performance Tag -->
    <rect x="285" y="762" width="230" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="400" y="786" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#4ade80" letter-spacing="1.5">
      ⚡ 60 FPS GPU ENGINE
    </text>
  </g>

  <!-- Inner Crisp Hex Rim -->
  <polygon points="400,36 750,239 750,685 400,888 50,685 50,239" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>
</svg>
